services:
  # Backend API Service
  - type: web
    name: agency-platform-backend
    runtime: node
    region: frankfurt
    buildCommand: |
      cd backend && npm ci --include=dev
      npx prisma generate
      npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agency-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Techno-logia <noreply@techno-logia.fr>"
      - key: NODE_ENV
        value: production
    autoDeploy: true

  # Frontend Service
  - type: web
    name: technologia
    runtime: node
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: agency-platform-backend
          type: web
          property: host
          suffix: /api
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          name: agency-platform-backend
          type: web
          property: host
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: technologia
          type: web
          property: host
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NODE_ENV
        value: production
    autoDeploy: true

databases:
  - name: agency-platform-db
    region: frankfurt
    databaseName: agency_platform
    user: postgres
    plan: free
    ipAllowList: []