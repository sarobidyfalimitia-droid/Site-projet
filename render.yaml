services:
  # Backend API Service
  - type: web
    name: agency-platform-backend
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: agency-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://agency-platform-frontend.onrender.com
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Techno-logia <noreply@techno-logia.fr>
      - key: SMTP_DISABLED
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1

  # Frontend Service
  - type: web
    name: agency-platform-frontend
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    rootDir: frontend
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://agency-platform-backend.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://agency-platform-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://agency-platform-frontend.onrender.com
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: agency-platform-db
    plan: starter
    region: frankfurt
    databaseName: agency_platform
    user: postgres
