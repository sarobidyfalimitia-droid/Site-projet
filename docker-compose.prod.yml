services:
  postgres:
    image: postgres:16-alpine
    container_name: agency_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: agency_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - agency-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agency-platform-backend:latest
    container_name: agency_backend_prod
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/agency_platform
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Techno-logia <noreply@techno-logia.fr>}
      SMTP_DISABLED: ${SMTP_DISABLED:-false}
    depends_on:
      - postgres
    networks:
      - agency-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agency-platform-frontend:latest
    container_name: agency_frontend_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      - backend
    networks:
      - agency-network

  nginx:
    image: nginx:alpine
    container_name: agency_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - agency-network

volumes:
  postgres_data_prod:

networks:
  agency-network:
    driver: bridge